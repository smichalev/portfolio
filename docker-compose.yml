services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` on purpose — reachable only from other containers on this
    # compose network, never from the host.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports:` — only nginx (over the compose network) can reach this.

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Published directly (not loopback) — this box's own port 80/443
      # already belong to a separate, unrelated nginx setup, so this
      # stack gets its own port instead of trying to integrate with that.
      # NOTE: 81 is not in Cloudflare's proxy allow-list (only 80, 8080,
      # 8880, 2052/2082/2086/2095 for HTTP), so the Cloudflare DNS record
      # for this host must be "DNS only" (grey cloud), not "Proxied" — no
      # Cloudflare TLS/CDN for this site, and the URL needs the port:
      # http://cvv.youmove.app:81. See root README.md.
      - "${NGINX_PORT:-81}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
