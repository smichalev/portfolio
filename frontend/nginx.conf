server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GraphQL API — proxied to the backend container, which has no port
    # published to the host. This also makes every request same-origin
    # from the browser's point of view, so CORS never enters the picture.
    location /graphql {
        proxy_pass http://backend:4000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # SPA — client-side routing (react-router) means unknown paths must
    # still resolve to index.html, not a 404 from nginx.
    location / {
        try_files $uri /index.html;
    }
}
